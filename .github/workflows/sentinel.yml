name: Sentinel review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
     - uses: notjwp/The-Sentinel@v1
       with:
          llm-api-key: ${{ secrets.NVIDIA_API_KEY }}
